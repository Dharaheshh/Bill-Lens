services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: billlens
      POSTGRES_PASSWORD: billlens
      POSTGRES_DB: billlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql+psycopg://billlens:billlens@db:5432/billlens
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
